name: Validate Firestore Security

on:
  push:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "tests/**"
      - ".github/workflows/validate-firestore-rules.yml"

  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "tests/**"
      - ".github/workflows/validate-firestore-rules.yml"

jobs:
  validate-firestore-security:
    name: Compile and Test Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Firestore test dependencies
        run: |
          npm install --no-save firebase @firebase/rules-unit-testing

      - name: Compile and test Firestore security rules
        run: >
          firebase emulators:exec
          --only firestore
          --project demo-quintrin
          "node --test tests/firestore-rules.test.mjs"
