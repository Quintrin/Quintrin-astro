    <stop offset="0" stop-color="#07131f"/>
    <stop offset=".55" stop-color="#0e1a24"/>
    <stop offset="1" stop-color="#183550"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b87554"/>
